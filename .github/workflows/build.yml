name: Build plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/ICEWATER_artefacts/Release/VST3/Denny Did It.vst3" dist/
          Copy-Item "build/ICEWATER_artefacts/Release/Standalone/Denny Did It.exe" dist/
          @"
          DENNY DID IT - Windows install

          VST3 (for FL Studio):
            Copy the folder "Denny Did It.vst3" into
            C:\Program Files\Common Files\VST3\
            then in FL Studio: Options > Manage plugins > Start scan.
            It shows up as "Denny Did It" under Installed > Generators.

          Standalone:
            Run "Denny Did It.exe" anywhere. Generated chord MIDI files land in
            Documents\ICEWATER Chords\
          "@ | Set-Content dist/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DennyDidIt-Windows
          path: dist/

  macos:
    name: macOS (VST3 + AU + Standalone, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/ICEWATER_artefacts/Release/VST3/Denny Did It.vst3" dist/
          cp -R "build/ICEWATER_artefacts/Release/AU/Denny Did It.component" dist/
          cp -R "build/ICEWATER_artefacts/Release/Standalone/Denny Did It.app" dist/
          cd dist && zip -ry ../DennyDidIt-macOS.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: DennyDidIt-macOS
          path: DennyDidIt-macOS.zip

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip Windows build
        run: cd artifacts/DennyDidIt-Windows && zip -r ../../DennyDidIt-Windows.zip . && cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            DennyDidIt-Windows.zip
            artifacts/DennyDidIt-macOS/DennyDidIt-macOS.zip
