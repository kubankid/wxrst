name: Build plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/ICEWATER_artefacts/Release/VST3/WXRST.vst3" dist/
          Copy-Item "build/ICEWATER_artefacts/Release/Standalone/WXRST.exe" dist/
          @"
          WXRST (THE WORST PLUGIN) - Windows install

          VST3 (for FL Studio):
            Copy the folder "WXRST.vst3" into
            C:\Program Files\Common Files\VST3\
            then in FL Studio: Options > Manage plugins > Start scan.
            It shows up as "WXRST" under Installed > Generators.

          Standalone:
            Run "WXRST.exe" anywhere. Generated chord MIDI files land in
            Documents\ICEWATER Chords\
          "@ | Set-Content dist/README.txt

      - name: Add installer script
        shell: pwsh
        run: Copy-Item installer/install-windows.bat dist/

      - uses: actions/upload-artifact@v4
        with:
          name: WXRST-Windows
          path: dist/

  macos:
    name: macOS (VST3 + AU + Standalone, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/ICEWATER_artefacts/Release/VST3/WXRST.vst3" dist/
          cp -R "build/ICEWATER_artefacts/Release/AU/WXRST.component" dist/
          cp -R "build/ICEWATER_artefacts/Release/Standalone/WXRST.app" dist/

      - name: Sign, notarize and zip
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ci/sign-mac.sh dist WXRST-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WXRST-macOS
          path: WXRST-macOS.zip

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the CMake project version
        run: |
          ver=$(sed -nE 's/^project\([A-Z_]+ VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -1)
          echo "CMake version $ver, tag ${GITHUB_REF_NAME}"
          [ "v$ver" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != v$ver (bump project VERSION in CMakeLists.txt)"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip Windows build
        run: cd artifacts/WXRST-Windows && zip -r ../../WXRST-Windows.zip . && cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            WXRST-Windows.zip
            artifacts/WXRST-macOS/WXRST-macOS.zip
